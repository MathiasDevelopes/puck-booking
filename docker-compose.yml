version: '3.8'

services:
  api:
    build: .
    container_name: puck-booking-api
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./hockey_booking.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - HOCKEY_API_URL=${HOCKEY_API_URL:-https://oilers.hockeydata.no/live/match?provider=automatic}
      - MAX_BOOKINGS_PER_MATCH=${MAX_BOOKINGS_PER_MATCH:-2}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

